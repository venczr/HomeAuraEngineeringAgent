[pytest]
# Pins the verification baseline so the suite runs identically for every agent,
# for CI, and from any working directory.
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --strict-config
xfail_strict = true
filterwarnings =
    default
    # starlette's TestClient still imports httpx; upstream deprecation, not ours.
    # StarletteDeprecationWarning subclasses UserWarning, not DeprecationWarning.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
